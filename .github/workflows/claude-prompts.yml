# The prompts loop, run on GitHub instead of on a PC (prompt p323).
#
# The window on the PC works the prompts of docs/prompts.csv by starting a
# headless Claude Code run on the repository: `claude --print` with the
# general prompt and the picked rows on stdin, bypassPermissions, and the run
# answers each prompt on its own row of the ledger. This workflow is that same
# run on a GitHub runner, started from the R&D page of fennecsig.com (/rnd,
# worker/rnd.js dispatches it) or by hand from the Actions tab: it checks the
# repository out, composes the very same prompt from the ledger, runs Claude
# Code, and then - the one thing the window leaves to a person - commits what
# changed to a branch of its own, rnd/run-<number>, and opens a pull request
# against the default branch. Nothing is pushed to main by it; the PR is
# merged from /rnd or on GitHub.
#
# It reads BOTH shapes of ledger: fennec-digital's (an `id` column, p323; a
# `status` column, open|done|dropped) and the seven columns the other Fennec
# repositories share (requested, executed, category, request, notes, work,
# files - a prompt is "csv row N", header not counted, and is open while
# `executed` is empty). The general prompt it composes is the one the window
# of that repository composes, so a run from here and a run from the PC are
# the same ask.
#
# And a THIRD shape (2026-11-10, when the dcvista and resolight repositories
# joined the pool): five columns - datetime, category, request, work, files -
# newest first, where a row with an EMPTY datetime is a request still waiting.
# A new row goes on top of such a file, so a row number counted from the top
# moves with every prompt added; the id of a row there is therefore counted
# from the BOTTOM (r1 is the oldest row), which is what /rnd sends, and the
# prompt composed here names each row by where it is at this moment.
#
# SECRETS (Settings > Secrets and variables > Actions, per repository or on
# the account): ONE of
#   ANTHROPIC_API_KEY          an API key (billed to the API), or
#   CLAUDE_CODE_OAUTH_TOKEN    `claude setup-token` on a PC signed in to a
#                              Pro/Max subscription
# Nothing else. GITHUB_TOKEN is the workflow's own and is enough to push the
# branch and open the PR (Settings > Actions > General > Workflow permissions
# must allow "Read and write" and "Allow GitHub Actions to create and approve
# pull requests").
#
# WHAT THE PLAN HAS LEFT (prompt p333). With every answer Claude Code gets it
# is told the state of the subscription's limits - the five-hour session and
# the week, each as a fraction used and the moment it resets - and it writes
# that into its stream as a `rate_limit_event`. The last one of a run is kept
# as an artifact of its own, claude-usage/usage.json, which is what the R&D
# page shows: the page holds no Claude credential and cannot ask for itself.
# `probe: usage` is a run that works no prompt and only asks - one word said
# to the smallest model, from an empty folder - for when the last run is too
# long ago to be believed. A run on an API key is told no such thing and
# leaves no such file.
#
# THE LIMIT ONE MODEL HAS (prompt p335). A third limit is told only in the
# replies of the model it belongs to: the week of Fable, which the stream
# names `seven_day_overage_included` and which no reply of Opus, Sonnet or
# Haiku carries (looked at on 2026-11-11: runs #8, #11 and #13). So a run
# keeps EVERY limit any of its reports named, each as it was last told, and
# not the last report alone; it writes down which models answered; and when
# Fable was one of them the same file is kept a second time under the name
# claude-usage-fable, so that the page can still find the last word on Fable
# after later runs on other models. A probe asks the model given in `model`
# (the page asks Fable) and the smallest one when none is given.
#
# WORKFLOW FILES ARE SET ASIDE. A runner may not push a change to a file under
# .github/workflows/: GitHub refuses the WHOLE push of a branch that carries
# one ("refusing to allow a GitHub App to create or update workflow ... without
# `workflows` permission"), and that permission is not one a workflow can be
# given. Until 2026-11-11 a run whose work touched a workflow file lost all of
# its work at the last step (p335, twice). Such changes are now taken out of
# the working tree before the commit and kept as workflow-changes.patch among
# the run's own files (the artifact claude-run-<number>); the rest is pushed,
# and the pull request says so in its title and first thing in its text. The
# patch is applied from a PC, where a person's own credential may push it.
#
# This file is copied into the other repositories by /rnd (Set up), so it
# must stay generic: nothing in it names this repository.

name: Claude prompts
run-name: "${{ inputs.probe == 'usage' && 'Claude usage asked' || format('prompts {0}', inputs.prompts || 'open') }} (rnd)"

on:
  workflow_dispatch:
    inputs:
      prompts:
        description: "The prompts to work, ids separated by commas: p323,p322 - or r12,r13, the row numbers, in a repository whose ledger has no id column (counted from the top; from the BOTTOM in a five-column, newest-first ledger). Empty: every open prompt."
        required: false
        default: ""
      stamp:
        description: "The datetime to write into `executed` (YYYY-MM-DD HH:MM). Empty: now, Asia/Jerusalem."
        required: false
        default: ""
      model:
        description: "The model (claude-opus-5-5, claude-sonnet-5-5, ...). Empty: the CLI's default - and, in a probe, the smallest model."
        required: false
        default: ""
      probe:
        description: "`usage`: work no prompt, only ask Claude Code how much of the plan is used. Empty: a run of prompts."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

# One run of prompts a repository at a time. A probe is in a group of its own:
# it changes nothing in the repository, and in the group of the prompts it
# would wait behind a run - or take the place of one that is waiting.
concurrency:
  group: claude-prompts-${{ github.repository }}${{ inputs.probe == 'usage' && '-probe' || '' }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PROMPTS: ${{ inputs.prompts }}
      STAMP: ${{ inputs.stamp }}
      MODEL: ${{ inputs.model }}
      PROBE: ${{ inputs.probe }}
    steps:
      # RND_DIR - where the run keeps its own files, outside the checkout so
      # none of them is ever committed - is set HERE and not in the env of the
      # job above: the `runner` context does not exist at the level of a job,
      # and GitHub refuses the whole file for naming it there ("Unrecognized
      # named-value: 'runner'"), which is what every run of this workflow
      # answered until 2026-11-10 - a failed run on each push, and a 422 to
      # every dispatch.
      - name: Where the run keeps its own files
        run: echo "RND_DIR=$RUNNER_TEMP/rnd" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Compose the prompt from the ledger
        id: compose
        shell: python
        run: |
          import csv, io, os, sys, datetime, zoneinfo, pathlib
          out = pathlib.Path(os.environ['RND_DIR']); out.mkdir(parents=True, exist_ok=True)
          if os.environ.get('PROBE', '').strip():
              # a probe works no prompt: every step that hangs on `count` is skipped
              print('a probe (%s): no prompt is composed' % os.environ['PROBE'].strip())
              open(os.environ['GITHUB_OUTPUT'], 'a').write('count=0\n')
              sys.exit(0)
          ids = [s.strip() for s in os.environ.get('PROMPTS', '').split(',') if s.strip()]
          stamp = os.environ.get('STAMP', '').strip() or datetime.datetime.now(
              zoneinfo.ZoneInfo('Asia/Jerusalem')).strftime('%Y-%m-%d %H:%M')
          raw = open('docs/prompts.csv', encoding='utf-8-sig', newline='').read()
          table = list(csv.reader(io.StringIO(raw)))
          head = [h.strip() for h in table[0]]
          col = {h: i for i, h in enumerate(head)}
          has_id = 'id' in col and 'status' in col
          is_log = not has_id and 'datetime' in col and 'executed' not in col
          rows = [r + [''] * (len(head) - len(r)) for r in table[1:] if any(c.strip() for c in r)]
          def cell(r, name): return r[col[name]].strip() if name in col else ''
          picked = []
          for n, r in enumerate(rows, 1):
              if has_id:
                  rid = cell(r, 'id') or ('r%d' % n)
                  is_open = cell(r, 'status') == 'open'
              elif is_log:
                  rid = 'r%d' % (len(rows) - n + 1)    # from the bottom: it never moves
                  is_open = not cell(r, 'datetime')
              else:
                  rid = 'r%d' % n
                  is_open = not cell(r, 'executed')
              if ids:
                  if rid in ids: picked.append((rid, n, r))
              elif is_open:
                  picked.append((rid, n, r))
          if ids:
              order = {k: i for i, k in enumerate(ids)}
              picked.sort(key=lambda t: order.get(t[0], 999))
          else:
              picked.sort(key=lambda t: t[1])
          if not picked:
              print('nothing to work: no prompt matched', ids or 'open')
              open(os.environ['GITHUB_OUTPUT'], 'a').write('count=0\n')
              sys.exit(0)
          # said to every run, whatever the shape of its ledger (2026-11-11)
          WORKFLOW_FILES = (
              'One kind of change cannot leave this runner: a file under .github/workflows/. GitHub refuses a '
              'push that carries one, so the workflow takes such changes out before it commits and keeps them '
              'as a patch with the files of the run, for a person to apply from a PC - the pull request will '
              'not have them. If a prompt needs such a change, make it all the same, and say in the answer, in '
              'plain words, that this one part is not applied yet and is waiting as the patch of this run.')
          if has_id:
              general = [
                  'Read CLAUDE.md in this directory, then work on the prompts picked below, in their order.',
                  'A prompt names the page it was raised on, as it is served: index.html is the public site '
                  '(src/index.html on disk), recipes/... is a recipe page, wiki/... is a page of this wiki - every '
                  'one of them under src/. A prompt with no page was typed. The work is done in the repository - '
                  "the site's file, the recipe tooling or spreadsheet, the wiki page, the code - never on a served "
                  'copy, and a recipe is never hand-edited under src/recipes/.',
                  'For each prompt: do the work; then answer it on its own row of docs/prompts.csv - the one store, '
                  'a row a prompt - by filling in work (see the next paragraph for how it is written), files (every '
                  'file touched, repository-relative), category, status "done" (or "dropped", the work saying why) '
                  'and executed set to the datetime given below. Change nothing else of the row: id, created and '
                  'the anchor are what a prompt is.',
                  'The work field is written in two parts, in this order, and the first of them is not optional. '
                  'FIRST a plain-language summary of two to four sentences, of the kind a tired person who writes '
                  'no code can read at a glance: what was wrong or what was asked, what it does now, and - if '
                  'anything is left for Boaz himself to do - what he has to do next, said as plainly as that. Say so '
                  'when there is nothing for him to do. No file names, no function names and no jargon in those '
                  'sentences. THEN a blank line, and after it the detail: what was actually changed and why, as long '
                  'as it needs to be and as comprehensive as the change deserves - this half may name files, '
                  'functions, tables and anything else. A prompt that is dropped is answered the same way, its '
                  'summary saying in plain words why it was not done.',
                  'This run is on a GitHub Actions runner, not on the PC: there is no window, no helper server, no '
                  'browser and no Cloudflare login. Do not try to serve or screenshot pages; verify by reading the '
                  'files and by running the node and python checks that need nothing of the machine.',
                  'Do not commit, do not push and do not deploy; leave the work in the working tree - the workflow '
                  'commits it to a branch and opens a pull request.',
                  WORKFLOW_FILES,
              ]
          elif is_log:
              general = [
                  'Read CLAUDE.md in this directory (and whichever topic file beside it a request needs), then '
                  'work on the requests picked below, in their order. A request is a row of docs/prompts.csv - '
                  'five columns, datetime, category, request, work, files, newest first - and a row with an '
                  'EMPTY datetime is a request still waiting. Each is named below by its row number counted '
                  'from the top, header not counted ("csv row N"), and by its own words.',
                  'For each request: do the work; then write the outcome into ITS OWN ROW of docs/prompts.csv, '
                  'which is the log itself, rewriting the file with the csv module, every column of every other '
                  'row kept exactly as it is and the order of the rows kept: datetime = the datetime given below, '
                  'category = one the file already uses (kept, if the row has one), work = what was done, '
                  'concrete and in the past tense (or why it was not done), files = every file touched, '
                  'repository-relative and comma separated. Leave request as it is. Where CLAUDE.md asks for '
                  'more than that when a request is answered, do that too.',
                  'Update CLAUDE.md when a convention or a structure it describes has moved.',
                  'This run is on a GitHub Actions runner, not on the PC: there is no window, no desktop, no '
                  'helper server and no browser. Do not try to start the GUI or to serve pages; verify by '
                  'reading the files and by running what needs nothing of the machine (py_compile, small '
                  'scripts).',
                  'Do not commit and do not push; leave the work in the working tree - the workflow commits it '
                  'to a branch and opens a pull request.',
                  WORKFLOW_FILES,
              ]
          else:
              general = [
                  'Read CLAUDE.md (and CLAUDE_GENERAL.md if it is there) in this directory, then work on the '
                  'requests picked below, in their order. A request is a row of docs/prompts.csv and is named by '
                  'its row number, header not counted ("csv row N").',
                  'Treat the notes column of a row as part of the request. For each request: do the work; then '
                  'write the outcome back into ITS OWN row of docs/prompts.csv, editing the file in place and '
                  'keeping the column order and the order of the rows: executed = the datetime given below '
                  '(written the way the other rows of the file write it), category added if the row has none, '
                  'work = one or two sentences saying what was done (or why it was not), files = every file '
                  'touched, repository-relative, and anything worth remembering added to notes. Leave requested '
                  'and request as they are.',
                  'Update CLAUDE.md when a convention or a structure it describes has moved.',
                  'This run is on a GitHub Actions runner, not on the PC: there is no window and no desktop. Do not '
                  'try to start the GUI; verify by reading the files and by running what needs nothing of the '
                  'machine (py_compile, small scripts).',
                  'Do not commit and do not push; leave the work in the working tree - the workflow commits it to '
                  'a branch and opens a pull request.',
                  WORKFLOW_FILES,
              ]
          # the instruction file as THIS repository spells it: dcvista-wiki and
          # resolight-wiki keep it as claude.md, which is the same file on a PC
          # and a different name on a runner's disk - a run told to read
          # CLAUDE.md there found none (2026-11-11)
          spelt = next((n for n in sorted(os.listdir('.')) if n.lower() == 'claude.md'), 'CLAUDE.md')
          general = [g.replace('CLAUDE.md', spelt) for g in general]
          lines = ['The prompts, %d of them:' % len(picked), '']
          for k, (rid, n, r) in enumerate(picked, 1):
              if has_id:
                  where = ', on %s' % cell(r, 'page') if cell(r, 'page') else ''
                  cat = cell(r, 'category')
                  lines.append('[%d] (%s, raised %s%s%s) %s' % (
                      k, rid, cell(r, 'created'), where,
                      (', file it under %s' % cat) if cat else '', cell(r, 'request')))
                  if cell(r, 'quote'):
                      lines.append('    the words it was raised on: "%s"' % cell(r, 'quote'))
              elif is_log:
                  cat = cell(r, 'category')
                  lines.append('[%d] (csv row %d%s) %s' % (
                      k, n, (', category %s' % cat) if cat else ', no category yet', cell(r, 'request')))
              else:
                  cat = cell(r, 'category')
                  lines.append('[%d] (csv row %d%s%s) %s' % (
                      k, n, (', requested %s' % cell(r, 'requested')) if cell(r, 'requested') else '',
                      (', category %s' % cat) if cat else '', cell(r, 'request')))
                  if cell(r, 'notes'):
                      lines.append('    notes: %s' % cell(r, 'notes'))
              lines.append('')
          lines.append('The datetime to stamp into the row of each finished prompt is %s - the time this run '
                       'was sent.' % stamp)
          text = '\n'.join(general) + '\n\n' + '\n'.join(lines) + '\n'
          (out / 'prompt.md').write_text(text, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('count=%d\n' % len(picked))
              f.write('ids=%s\n' % ','.join(t[0] for t in picked))
              f.write('stamp=%s\n' % stamp)
          print(text)

      - name: Work the prompts
        if: steps.compose.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set on this repository (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # an empty key must not be seen by the CLI: it would try the API with nothing
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          MODEL_ARG=""
          [ -n "$MODEL" ] && MODEL_ARG="--model $MODEL"
          claude --print --verbose --output-format stream-json \
                 --permission-mode bypassPermissions $MODEL_ARG \
                 < "$RND_DIR/prompt.md" | tee "$RND_DIR/claude-run.log" \
                 | python3 -c '
          import sys, json
          for line in sys.stdin:
              try: e = json.loads(line)
              except Exception: continue
              t = e.get("type")
              if t == "assistant":
                  for b in e.get("message", {}).get("content", []):
                      if b.get("type") == "text": print(b["text"][:2000])
                      elif b.get("type") == "tool_use": print("  [" + b.get("name", "") + "] " + json.dumps(b.get("input", {}))[:160])
              elif t == "result":
                  print("--- result: turns=%s seconds=%.0f" % (e.get("num_turns"), (e.get("duration_ms") or 0) / 1000))
          '

      # The probe: one word said to a model - the one given in `model`, the
      # smallest when none is - which is all it takes for Claude Code to be
      # told where the limits stand. The page asks Fable: the week of Fable is
      # told in the replies of Fable alone (p335). From an EMPTY folder
      # and not from the checkout - the instruction file of a repository is
      # read into every session started in it, and this one has nothing to do
      # with the repository.
      - name: Ask Claude Code how much of the plan is used
        if: inputs.probe == 'usage'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set on this repository (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          mkdir -p "$RND_DIR" "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          echo "the model asked: ${MODEL:-haiku}"
          echo "Reply with the one word: ok" \
            | claude --print --verbose --output-format stream-json --model "${MODEL:-haiku}" \
            > "$RND_DIR/claude-run.log"
          grep -c '"rate_limit_event"' "$RND_DIR/claude-run.log" | sed 's/^/reports of the limits in the stream: /' || true

      # What Claude Code was last told of the plan's limits in this run, kept
      # as a file of its own for the R&D page - and beside it what the run
      # itself spent. Written after a run of prompts and after a probe alike,
      # failed or not: a run that stopped on the limit is the one whose report
      # matters most.
      - name: What the plan has left
        id: usage
        if: always()
        shell: python
        run: |
          import datetime, json, os, pathlib
          d = pathlib.Path(os.environ.get('RND_DIR') or '.')
          log = d / 'claude-run.log'
          info = result = None
          model = ''
          windows, models, reports = {}, [], 0
          def answered(m):
              if isinstance(m, str) and m.startswith('claude') and m not in models: models.append(m)
          if log.is_file():
              for line in log.read_text(encoding='utf-8', errors='replace').splitlines():
                  try: e = json.loads(line)
                  except Exception: continue
                  if not isinstance(e, dict): continue
                  t = e.get('type')
                  if t == 'rate_limit_event' and isinstance(e.get('rate_limit_info'), dict):
                      info = e['rate_limit_info']
                      reports += 1
                      for name, w in (info.get('unifiedWindows') or {}).items():
                          if isinstance(w, dict): windows[name] = w
                  elif t == 'assistant':
                      answered((e.get('message') or {}).get('model'))
                  elif t == 'result':
                      result = e
                      for m in (e.get('modelUsage') or {}): answered(m)
                  elif t == 'system' and e.get('subtype') == 'init':
                      model = e.get('model') or ''
          if info is not None:
              # the LAST report is the state of the plan, but the limits named in
              # it are those of the model that last answered: a limit only one
              # model has is in the reports of that model alone, so every limit
              # any report of the run named is kept, each as it was last told
              info = dict(info, unifiedWindows=windows) if windows else info
              u = (result or {}).get('usage') or {}
              spent = None
              if result:
                  spent = {
                      'cost_usd': result.get('total_cost_usd'), 'turns': result.get('num_turns'),
                      'seconds': round((result.get('duration_ms') or 0) / 1000),
                      'input_tokens': u.get('input_tokens'), 'output_tokens': u.get('output_tokens'),
                      'cache_read_input_tokens': u.get('cache_read_input_tokens'),
                      'cache_creation_input_tokens': u.get('cache_creation_input_tokens'),
                  }
              (d / 'usage.json').write_text(json.dumps({
                  'at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'repo': os.environ.get('GITHUB_REPOSITORY', ''),
                  'run': int(os.environ.get('GITHUB_RUN_NUMBER') or 0),
                  'run_id': int(os.environ.get('GITHUB_RUN_ID') or 0),
                  'kind': 'probe' if os.environ.get('PROBE', '').strip() else 'prompts',
                  'model': model, 'models': models, 'reports': reports,
                  'rate_limit': info, 'spent': spent,
              }, indent=1), encoding='utf-8')
              print('%d report(s) of the limits; the models that answered: %s' % (reports, ', '.join(models) or '?'))
              print(json.dumps(info))
          else:
              print('Claude Code reported nothing of the limits in this run')
          # the limit one model has, told by Fable: this is the last word on Fable
          fable = info is not None and 'seven_day_overage_included' in windows and any(
              'fable' in m.lower() for m in models + [model])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('have=%d\n' % (1 if info is not None else 0))
              f.write('fable=%d\n' % (1 if fable else 0))

      - uses: actions/upload-artifact@v4
        if: always() && steps.usage.outputs.have == '1'
        with:
          name: claude-usage
          path: ${{ runner.temp }}/rnd/usage.json
          retention-days: 30

      # the same file a second time when it carries the week of Fable, under a
      # name of its own: the newest claude-usage is the newest report, and the
      # newest claude-usage-fable is the newest that says anything of Fable
      - uses: actions/upload-artifact@v4
        if: always() && steps.usage.outputs.fable == '1'
        with:
          name: claude-usage-fable
          path: ${{ runner.temp }}/rnd/usage.json
          retention-days: 30

      - name: The summary of the run
        if: always() && steps.compose.outputs.count != '0'
        shell: python
        run: |
          import json, os, pathlib
          d = pathlib.Path(os.environ['RND_DIR'])
          result = ''
          log = d / 'claude-run.log'
          if log.is_file():
              for line in log.read_text(encoding='utf-8', errors='replace').splitlines():
                  try: e = json.loads(line)
                  except Exception: continue
                  if e.get('type') == 'result':
                      result = e.get('result') or ''
          text = ('## Claude prompts run %s\n\nPrompts: `%s`\nStamp: `%s`\n\n%s\n' % (
              os.environ.get('GITHUB_RUN_NUMBER', ''), os.environ.get('IDS', ''),
              os.environ.get('STAMP_OUT', ''), result or '_(the run left no summary)_'))
          (d / 'summary.md').write_text(text, encoding='utf-8')
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(text)
        env:
          IDS: ${{ steps.compose.outputs.ids }}
          STAMP_OUT: ${{ steps.compose.outputs.stamp }}

      - name: Commit to a branch and open a pull request
        if: steps.compose.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.compose.outputs.ids }}
        run: |
          git config user.name "Claude (rnd)"
          git config user.email "noreply@anthropic.com"
          # Workflow files first (see the head of this file): what the run changed
          # under .github/workflows/ is written out as a patch and put back as it
          # was, so that the push below carries none of it and is not refused.
          WF=".github/workflows"
          git add -A -- "$WF" 2>/dev/null || true
          ASIDE="$(git diff --cached --name-only -- "$WF" | tr '\n' ' ' | sed 's/ *$//')"
          TITLE="prompts ${IDS} (rnd run ${{ github.run_number }})"
          if [ -n "$ASIDE" ]; then
            git diff --cached --binary -- "$WF" > "$RND_DIR/workflow-changes.patch"
            git reset -q -- "$WF"
            git checkout -q -- "$WF" 2>/dev/null || true
            git clean -fdq -- "$WF"
            TITLE="$TITLE - workflow changes set aside"
            {
              echo "> **Not in this pull request: the changes to workflow files.** This run also changed \`${ASIDE}\`, and GitHub does not let a run push a change to a workflow file. Those changes were taken out and are kept as \`workflow-changes.patch\` in the artifact \`claude-run-${{ github.run_number }}\` of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). They are applied from a PC: download the artifact, \`git apply workflow-changes.patch\`, commit and push - or ask Claude on the PC to apply the workflow patch of run ${{ github.run_number }} of this repository."
              echo
              cat "$RND_DIR/summary.md" 2>/dev/null || true
            } > "$RND_DIR/summary.new" && mv "$RND_DIR/summary.new" "$RND_DIR/summary.md"
            echo "::warning title=Workflow changes set aside::${ASIDE} - kept as workflow-changes.patch in the artifact claude-run-${{ github.run_number }}; a runner may not push a change to a workflow file"
            printf '\n**Workflow changes set aside** (`%s`): kept as `workflow-changes.patch` in the artifact of this run - a runner may not push them.\n' "$ASIDE" >> "$GITHUB_STEP_SUMMARY"
          fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            if [ -n "$ASIDE" ]; then
              echo "::error title=Only workflow files were changed::${ASIDE} - a runner may not push them, so there is no branch and no pull request; the changes are kept as workflow-changes.patch in the artifact claude-run-${{ github.run_number }}, to be applied from a PC"
              exit 1
            fi
            echo "nothing changed in the working tree; no branch and no pull request"
            exit 0
          fi
          BR="rnd/run-${{ github.run_number }}"
          git checkout -b "$BR"
          git add -A
          git commit -m "$TITLE" \
                     -m "Worked on a GitHub Actions runner from fennecsig.com/rnd." \
                     -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push -u origin "$BR"
          gh pr create --base "${{ github.ref_name }}" --head "$BR" \
             --title "$TITLE" \
             --body-file "$RND_DIR/summary.md"

      - uses: actions/upload-artifact@v4
        if: always() && steps.compose.outputs.count != '0'
        with:
          name: claude-run-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/rnd/prompt.md
            ${{ runner.temp }}/rnd/claude-run.log
            ${{ runner.temp }}/rnd/summary.md
            ${{ runner.temp }}/rnd/workflow-changes.patch
          if-no-files-found: ignore
